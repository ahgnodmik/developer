name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # manual "Run workflow" button — click after editing Notion
  schedule:
    - cron: '0 * * * *'     # hourly rebuild so Notion edits reflect without manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Notion secrets live only in this step, so the Next.js build and its
      # dependencies never see them.
      # NOTION_* absent => scripts/fetch-notion.mjs falls back to static data
      - name: Fetch Notion data
        run: npm run fetch:notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}

      # custom domain (samdong.xyz) serves from root — no basePath
      # --ignore-scripts skips the prebuild hook; data was fetched above
      - name: Build
        run: npm run build --ignore-scripts

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
